ame: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Apply the writing-practice changes
        run: |
          z=$(find . -path ./.git -prune -o -type f -name 'writing-patch*.zip' -print | head -1)
          if [ -n "$z" ]; then echo "Applying $z"; unzip -o "$z" -d . ; else echo "::warning::writing-patch.zip not found; building the app unchanged"; fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Build APK
        run: |
          set -o pipefail
          bash tools/ci_build.sh 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Durtles Writing build ${{ github.run_number }}
          files: ${{ runner.temp }}/out/durtles-writing.apk
          fail_on_unmatched_files: true
          body: Open this page on your Android device and tap durtles-writing.apk to install or update.

      - name: Save the build log for Claude
        if: always()
        run: |
          git config --global user.name "build bot"; git config --global user.email "bot@users.noreply.github.com"
          n=${{ github.run_number }}
          cp "$RUNNER_TEMP/build.log" "$RUNNER_TEMP/build-$n.log" 2>/dev/null || echo "no log" > "$RUNNER_TEMP/build-$n.log"
          tail -c 400000 "$RUNNER_TEMP/build-$n.log" > "$RUNNER_TEMP/b" && mv "$RUNNER_TEMP/b" "$RUNNER_TEMP/build-$n.log"
          echo "${{ job.status }}" > "$RUNNER_TEMP/status-$n.txt"
          L="$RUNNER_TEMP/logs"; rm -rf "$L"
          if git fetch origin ci-logs 2>/dev/null; then git worktree add "$L" FETCH_HEAD; cd "$L"; git checkout -B ci-logs; else git worktree add --detach "$L"; cd "$L"; git checkout --orphan ci-logs; git rm -rf -q . || true; fi
          cp "$RUNNER_TEMP/build-$n.log" "$RUNNER_TEMP/status-$n.txt" .
          git add "build-$n.log" "status-$n.txt" && git commit -q -m "Build log $n" && git push origin ci-logs
