name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Apply the writing-practice changes
        run: |
          z=$(find . -path ./.git -prune -o -type f -name 'writing-patch*.zip' -print | head -1)
          if [ -n "$z" ]; then echo "Applying $z"; unzip -o "$z" -d . ; else echo "::warning::writing-patch.zip not found; building the app unchanged"; fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Build APK
        run: |
          set -o pipefail
          bash tools/ci_build.sh 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Durtles Writing build ${{ github.run_number }}
          files: ${{ runner.temp }}/out/durtles-writing.apk
          fail_on_unmatched_files: true
          body: Open this page on your Android device and tap durtles-writing.apk to install or update.

      - name: Save the build log for Claude
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_number }}
          STATUS: ${{ job.status }}
        run: |
          cd "$RUNNER_TEMP"
          [ -f build.log ] || echo "The build step did not run or produced no output." > build.log
          tail -c 400000 build.log > "build-$RUN.log"
          echo "$STATUS" > "status-$RUN.txt"
          url="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          rm -rf logs
          if git clone -q --depth 1 --branch ci-logs "$url" logs; then cd logs; else mkdir logs; cd logs; git init -q; git checkout -q -b ci-logs; git remote add origin "$url"; fi
          cp "../build-$RUN.log" "../status-$RUN.txt" .
          git add "build-$RUN.log" "status-$RUN.txt"
          git -c user.name="build bot" -c user.email="bot@users.noreply.github.com" commit -q -m "Build log $RUN"
          git push -q origin ci-logs
